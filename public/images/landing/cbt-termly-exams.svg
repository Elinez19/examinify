<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgPearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="55%" stop-color="#EDF3FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <radialGradient id="bgCobalt" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#478BFF"/>
      <stop offset="50%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#05113D"/>
    </radialGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="cobaltGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="25%" stop-color="#478BFF"/>
      <stop offset="75%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#0A2999"/>
    </linearGradient>
    <linearGradient id="goldGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </linearGradient>
    <filter id="drop3d" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#05113D" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0E46F5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="64" fill="url(#bgPearl)"/>
  <circle cx="300" cy="300" r="210" fill="#FFFFFF" opacity="0.78"/>
  <ellipse cx="300" cy="495" rx="170" ry="26" fill="#0E46F5" opacity="0.14"/>

  <g filter="url(#drop3d)">
    <!-- 3D Glossy CBT Exam Workstation Monitor -->
    <rect x="105" y="130" width="390" height="265" rx="36" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="125" y="150" width="350" height="225" rx="22" fill="url(#bgCobalt)"/>
    <path d="M145 162 L295 162 L205 360 L145 360 Z" fill="#FFFFFF" opacity="0.12"/>

    <!-- Monitor Stand -->
    <rect x="265" y="395" width="70" height="44" rx="12" fill="url(#porcelain)"/>
    <rect x="195" y="432" width="210" height="28" rx="14" fill="url(#cobaltGloss)" stroke="#FFFFFF" stroke-width="4"/>

    <!-- CBT Question Rows Inside Screen -->
    <rect x="155" y="182" width="190" height="22" rx="11" fill="#FFFFFF" opacity="0.92"/>
    <!-- Option A -->
    <rect x="155" y="224" width="245" height="36" rx="14" fill="#FFFFFF" opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="177" cy="242" r="9" fill="#5CE1FF"/>
    <rect x="198" y="237" width="140" height="10" rx="5" fill="#FFFFFF" opacity="0.65"/>
    <!-- Option B Selected -->
    <rect x="155" y="272" width="245" height="38" rx="14" fill="url(#porcelain)"/>
    <circle cx="177" cy="291" r="10" fill="#00C47E"/>
    <path d="M172 291 L176 295 L183 287" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="198" y="286" width="160" height="10" rx="5" fill="#0E46F5" opacity="0.35"/>
    <!-- Option C -->
    <rect x="155" y="322" width="245" height="34" rx="14" fill="#FFFFFF" opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="177" cy="339" r="9" fill="#5CE1FF"/>
    <rect x="198" y="334" width="120" height="10" rx="5" fill="#FFFFFF" opacity="0.65"/>

    <!-- Floating Countdown Timer Badge -->
    <circle cx="452" cy="162" r="60" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="452" cy="162" r="44" fill="url(#cobaltGloss)"/>
    <circle cx="452" cy="162" r="34" stroke="url(#goldGloss)" stroke-width="7" stroke-dasharray="155 60" stroke-linecap="round"/>
    <path d="M452 142 V164 L468 173" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
