<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgPearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="55%" stop-color="#EDF3FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <radialGradient id="bgCobalt" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#478BFF"/>
      <stop offset="50%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#05113D"/>
    </radialGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="cobaltGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="25%" stop-color="#478BFF"/>
      <stop offset="75%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#0A2999"/>
    </linearGradient>
    <linearGradient id="goldGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </linearGradient>
    <filter id="drop3d" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#05113D" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0E46F5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="64" fill="url(#bgPearl)"/>
  <circle cx="300" cy="300" r="210" fill="#FFFFFF" opacity="0.78"/>
  <ellipse cx="300" cy="495" rx="170" ry="26" fill="#0E46F5" opacity="0.14"/>

  <g filter="url(#drop3d)">
    <!-- Distraction-Free Workstation Frame -->
    <rect x="98" y="142" width="388" height="275" rx="38" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="120" y="164" width="344" height="231" rx="24" fill="url(#bgCobalt)"/>
    <path d="M138 176 H288 L198 375 H138 Z" fill="#FFFFFF" opacity="0.1"/>

    <!-- Stand -->
    <rect x="258" y="417" width="68" height="38" rx="12" fill="url(#porcelain)"/>
    <rect x="192" y="446" width="200" height="26" rx="13" fill="url(#cobaltGloss)" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Clean Exam Question Prompt + Selected Option Tiles -->
    <rect x="150" y="192" width="210" height="26" rx="13" fill="#FFFFFF" opacity="0.94"/>
    <rect x="150" y="236" width="250" height="40" rx="16" fill="url(#porcelain)"/>
    <circle cx="176" cy="256" r="10" fill="#00C47E"/>
    <path d="M171 256 L175 260 L182 252" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="198" y="250" width="165" height="12" rx="6" fill="#0E46F5" opacity="0.32"/>

    <rect x="150" y="290" width="250" height="36" rx="15" fill="#FFFFFF" opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="176" cy="308" r="9" fill="#5CE1FF"/>
    <rect x="198" y="303" width="138" height="10" rx="5" fill="#FFFFFF" opacity="0.7"/>

    <rect x="150" y="338" width="250" height="36" rx="15" fill="#FFFFFF" opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="176" cy="356" r="9" fill="#5CE1FF"/>
    <rect x="198" y="351" width="115" height="10" rx="5" fill="#FFFFFF" opacity="0.7"/>

    <!-- Floating Countdown Stopwatch -->
    <circle cx="445" cy="166" r="64" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="445" cy="166" r="47" fill="url(#cobaltGloss)"/>
    <circle cx="445" cy="166" r="36" stroke="url(#goldGloss)" stroke-width="7" stroke-dasharray="168 58" stroke-linecap="round"/>
    <path d="M445 144 V168 L462 178" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating Autosave Cloud Sync Pill -->
    <rect x="330" y="378" width="176" height="62" rx="31" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="364" cy="409" r="20" fill="#00C47E"/>
    <path d="M356 409 L362 415 L373 403" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="396" y="401" width="84" height="16" rx="8" fill="#0E46F5" opacity="0.25"/>
  </g>
</svg>
