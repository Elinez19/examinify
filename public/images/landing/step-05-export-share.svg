<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="cobalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="40%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#0A2999"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#05113D" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="56" fill="url(#bg)"/>
  <g filter="url(#s)">
    <!-- Broadsheet Sheet -->
    <rect x="80" y="88" width="215" height="232" rx="28" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="6"/>
    <rect x="106" y="114" width="163" height="40" rx="14" fill="url(#cobalt)"/>
    <rect x="122" y="129" width="90" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Mini Chart -->
    <rect x="106" y="170" width="163" height="86" rx="18" fill="#05113D"/>
    <rect x="126" y="210" width="20" height="32" rx="6" fill="#5CE1FF"/>
    <rect x="156" y="192" width="20" height="50" rx="6" fill="#FFFFFF" opacity="0.9"/>
    <rect x="186" y="200" width="20" height="42" rx="6" fill="#5CE1FF"/>
    <rect x="216" y="186" width="20" height="56" rx="6" fill="url(#gold)"/>

    <rect x="106" y="272" width="120" height="22" rx="11" fill="#EDF3FF"/>

    <!-- Floating Download & Share Orb -->
    <circle cx="290" cy="264" r="46" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="290" cy="264" r="35" fill="url(#cobalt)"/>
    <path d="M290 246 V276 M278 265 L290 278 L302 265" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="274" y="283" width="32" height="6" rx="3" fill="url(#gold)"/>
  </g>
</svg>
