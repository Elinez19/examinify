<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgPearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="55%" stop-color="#EDF3FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <radialGradient id="bgCobalt" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#478BFF"/>
      <stop offset="50%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#05113D"/>
    </radialGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="cobaltGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="25%" stop-color="#478BFF"/>
      <stop offset="75%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#0A2999"/>
    </linearGradient>
    <linearGradient id="goldGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </linearGradient>
    <filter id="drop3d" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#05113D" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0E46F5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="64" fill="url(#bgPearl)"/>
  <circle cx="300" cy="300" r="210" fill="#FFFFFF" opacity="0.78"/>
  <ellipse cx="300" cy="495" rx="165" ry="26" fill="#0E46F5" opacity="0.14"/>

  <g filter="url(#drop3d)">
    <!-- Kid-Friendly Primary CBT Tablet -->
    <rect x="115" y="135" width="350" height="320" rx="44" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="139" y="159" width="302" height="272" rx="28" fill="url(#bgCobalt)"/>

    <!-- Screen Specular Highlight -->
    <path d="M155 170 H300 L215 360 H155 Z" fill="#FFFFFF" opacity="0.12"/>

    <!-- Question Prompt Pill -->
    <rect x="165" y="185" width="250" height="36" rx="18" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="190" cy="203" r="9" fill="url(#goldGloss)"/>
    <rect x="210" y="198" width="175" height="10" rx="5" fill="#0E46F5" opacity="0.28"/>

    <!-- Friendly 2x2 Big Touch Option Tiles -->
    <rect x="165" y="242" width="116" height="72" rx="20" fill="url(#porcelain)"/>
    <circle cx="195" cy="278" r="14" fill="url(#cobaltGloss)"/>
    <rect x="220" y="272" width="42" height="12" rx="6" fill="#DBE8FF"/>

    <rect x="299" y="242" width="116" height="72" rx="20" fill="url(#goldGloss)" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M342 278 L354 290 L376 264" stroke="#05113D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="165" y="330" width="116" height="72" rx="20" fill="url(#porcelain)"/>
    <circle cx="195" cy="366" r="14" fill="#5CE1FF"/>
    <rect x="220" y="360" width="42" height="12" rx="6" fill="#DBE8FF"/>

    <rect x="299" y="330" width="116" height="72" rx="20" fill="url(#porcelain)"/>
    <circle cx="329" cy="366" r="14" fill="#478BFF"/>
    <rect x="354" y="360" width="42" height="12" rx="6" fill="#DBE8FF"/>

    <!-- Floating Gold Star Badge -->
    <circle cx="455" cy="160" r="56" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="455" cy="160" r="42" fill="url(#goldGloss)"/>
    <path d="M455 130 L463 148 L482 150 L468 163 L472 182 L455 173 L438 182 L442 163 L428 150 L447 148 Z" fill="#FFFFFF"/>

    <!-- Sleek Stylus Pencil -->
    <g transform="translate(465 340) rotate(32)">
      <rect x="-18" y="-90" width="36" height="165" rx="18" fill="url(#cobaltGloss)" stroke="#FFFFFF" stroke-width="5"/>
      <rect x="-18" y="-90" width="36" height="34" rx="14" fill="url(#goldGloss)"/>
      <path d="M-14 68 L0 98 L14 68 Z" fill="url(#porcelain)"/>
    </g>
  </g>
</svg>
