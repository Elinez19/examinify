<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="cobalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="40%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#0A2999"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#05113D" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="56" fill="url(#bg)"/>
  <g filter="url(#s)">
    <!-- Graded Script Card -->
    <rect x="82" y="82" width="212" height="240" rx="28" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="6"/>
    <rect x="108" y="112" width="160" height="46" rx="16" fill="url(#cobalt)"/>
    <rect x="126" y="129" width="90" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="242" cy="135" r="10" fill="url(#gold)"/>

    <!-- Script Review Rows with Slider / Score Adjust -->
    <rect x="108" y="176" width="160" height="36" rx="14" fill="#EDF3FF"/>
    <circle cx="130" cy="194" r="9" fill="#00C47E"/>
    <rect x="150" y="188" width="95" height="12" rx="6" fill="#0E46F5" opacity="0.28"/>

    <rect x="108" y="224" width="160" height="36" rx="14" fill="#EDF3FF"/>
    <circle cx="130" cy="242" r="9" fill="url(#gold)"/>
    <rect x="150" y="236" width="76" height="12" rx="6" fill="#0E46F5" opacity="0.28"/>

    <rect x="108" y="274" width="104" height="26" rx="13" fill="#00C47E"/>

    <!-- Floating Magnifier / Approve Seal -->
    <circle cx="288" cy="264" r="46" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="288" cy="264" r="34" fill="#00C47E"/>
    <path d="M274 264 L284 274 L303 253" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
