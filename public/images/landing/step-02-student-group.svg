<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="cobalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="40%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#0A2999"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#05113D" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="56" fill="url(#bg)"/>
  <g filter="url(#s)">
    <!-- Cohort Group Card Backing -->
    <rect x="70" y="95" width="260" height="215" rx="32" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="6"/>
    <rect x="92" y="118" width="216" height="40" rx="16" fill="url(#cobalt)"/>
    <circle cx="118" cy="138" r="9" fill="url(#gold)"/>
    <rect x="138" y="132" width="130" height="12" rx="6" fill="#FFFFFF" opacity="0.9"/>

    <!-- Three Learner Avatars in Group -->
    <g transform="translate(0 6)">
      <circle cx="136" cy="204" r="24" fill="#5CE1FF" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="136" cy="197" r="9" fill="#05113D"/>
      <path d="M120 220 C122 210 150 210 152 220" fill="#05113D"/>

      <circle cx="200" cy="196" r="28" fill="url(#cobalt)" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="200" cy="188" r="10" fill="#FFFFFF"/>
      <path d="M181 214 C183 202 217 202 219 214" fill="#FFFFFF"/>

      <circle cx="264" cy="204" r="24" fill="url(#gold)" stroke="#FFFFFF" stroke-width="4"/>
      <circle cx="264" cy="197" r="9" fill="#05113D"/>
      <path d="M248 220 C250 210 278 210 280 220" fill="#05113D"/>
    </g>

    <!-- Ready Pill Badge -->
    <rect x="116" y="256" width="168" height="32" rx="16" fill="#00C47E"/>
    <path d="M140 272 L147 279 L160 265" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="172" y="266" width="90" height="12" rx="6" fill="#FFFFFF" opacity="0.92"/>
  </g>
</svg>
