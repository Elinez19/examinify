<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgPearl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6F9FF"/>
      <stop offset="55%" stop-color="#EDF3FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <radialGradient id="bgCobalt" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#478BFF"/>
      <stop offset="50%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#05113D"/>
    </radialGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F6F9FF"/>
      <stop offset="100%" stop-color="#DBE8FF"/>
    </linearGradient>
    <linearGradient id="cobaltGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="25%" stop-color="#478BFF"/>
      <stop offset="75%" stop-color="#0E46F5"/>
      <stop offset="100%" stop-color="#0A2999"/>
    </linearGradient>
    <linearGradient id="goldGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#CC8800"/>
    </linearGradient>
    <filter id="drop3d" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#05113D" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0E46F5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="64" fill="url(#bgPearl)"/>
  <circle cx="300" cy="300" r="210" fill="#FFFFFF" opacity="0.78"/>
  <ellipse cx="300" cy="495" rx="150" ry="26" fill="#0E46F5" opacity="0.14"/>

  <g filter="url(#drop3d)">
    <!-- 3D Glossy Porcelain & Cobalt Anti-Malpractice Shield -->
    <path d="M300 112 L440 165 V288 C440 384 374 446 300 478 C226 446 160 384 160 288 V165 Z" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
    <path d="M300 138 L414 182 V285 C414 366 359 418 300 446 C241 418 186 366 186 285 V182 Z" fill="url(#bgCobalt)" stroke-linejoin="round"/>
    <path d="M186 182 L300 138 V446 C241 418 186 366 186 285 Z" fill="#FFFFFF" opacity="0.08"/>

    <!-- 3D Gold Padlock Centered Inside Shield -->
    <path d="M258 265 V232 C258 208 277 190 300 190 C323 190 342 208 342 232 V265" stroke="url(#porcelain)" stroke-width="20" stroke-linecap="round"/>
    <rect x="234" y="256" width="132" height="106" rx="26" fill="url(#goldGloss)" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="300" cy="302" r="14" fill="#05113D"/>
    <rect x="294" y="308" width="12" height="26" rx="6" fill="#05113D"/>

    <!-- Floating Verified Check Pill -->
    <circle cx="425" cy="405" r="46" fill="url(#porcelain)" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="425" cy="405" r="34" fill="#00C47E"/>
    <path d="M410 405 L421 416 L441 394" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
